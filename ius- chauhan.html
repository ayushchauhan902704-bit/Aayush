*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#000;color:#fff}
.header{padding:15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222;position:sticky;top:0;background:#000;z-index:10}

.btns{display:flex;gap:10px;margin-top:10px}

.posts{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:20px}
.post{aspect-ratio:1/1;position:relative;overflow:hidden;background:#111}
.post img{width:100%;height:100%;object-fit:cover;transition:.4s}
