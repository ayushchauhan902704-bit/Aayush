<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ToolzyAI V2 - 50+ Real AI Tools</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui;background:#0a0a0f;color:#fff}.header{position:sticky;top:0;z-index:50;background:rgba(10,10,15,0.9);backdrop-filter:blur(20px);border-bottom:1px solid #222;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}.logo{font-weight:900;font-size:22px;background:linear-gradient(90deg,#f59e0b,#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent;cursor:pointer}.btn{padding:8px 16px;border-radius:999px;border:1px solid #333;background:#1a1a22;color:#fff;cursor:pointer;font-size:13px}.btn-primary{background:linear-gradient(90deg,#f59e0b,#ef4444);border:0;font-weight:700}.hero{text-align:center;padding:40px 20px 10px}.hero h1{font-size:32px;font-weight:900;max-width:800px;margin:0 auto}.hero h1 span{background:linear-gradient(90deg,#f59e0b,#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.hero p{color:#888;margin:12px auto;max-width:600px;font-size:14px}.search{max-width:600px;margin:20px auto;background:#15151d;border:1px solid #2a2a35;border-radius:14px;display:flex;align-items:center;padding:4px 6px 4px 16px}.search input{flex:1;background:transparent;border:0;color:#fff;outline:none;padding:10px 0;font-size:15px}.grid{max-width:1200px;margin:20px auto;padding:0 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.card{background:#15151d;border:1px solid #252532;border-radius:16px;padding:16px;cursor:pointer}.card:hover{border-color:#f59e0b;transform:translateY(-3px)}.ico{width:36px;height:36px;border-radius:10px;background:#222;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:8px}.card h3{font-size:13px;font-weight:700}.card p{font-size:11px;color:#666;margin-top:4px}.badge{background:#f59e0b;color:#000;font-size:9px;font-weight:800;padding:2px 6px;border-radius:99px;display:inline-block;margin-bottom:6px}.page{display:none;max-width:800px;margin:0 auto;padding:20px}.page.on{display:block}.toolbox{background:#15151d;border:1px solid #252532;border-radius:20px;padding:24px;margin-top:20px}.toolbox textarea{width:100%;background:#0a0a0f;border:1px solid #333;border-radius:12px;padding:14px;color:#fff;min-height:120px;outline:none;font-size:14px}.res{background:#0a0a0f;border:1px dashed #333;border-radius:12px;padding:16px;font-size:14px;color:#ddd;min-height:80px;margin-top:12px;white-space:pre-wrap;line-height:1.5}.footer{text-align:center;padding:30px;color:#444;font-size:12px;border-top:1px solid #1a1a1a;margin-top:40px}.loginbox{max-width:400px;margin:60px auto;background:#15151d;border:1px solid #333;border-radius:20px;padding:28px;text-align:center}.loginbox input{width:100%;background:#0a0a0f;border:1px solid #333;border-radius:10px;padding:12px;color:#fff;margin:8px 0;outline:none}
</style></head><body>
<div class="header"><div class="logo" onclick="goHome()">ToolzyAI</div><div id="auth"><button class="btn" onclick="showLogin()">Login</button><button class="btn btn-primary" onclick="showLogin()">Get Started</button></div></div>
<div id="home"><div class="hero"><h1>Build with AI, <span>Create Everything</span> - 50+ Real AI Tools</h1><p>Ab real AI ke saath! ToolBaz se 10x tez. Har tool ka alag page, login system.</p><div class="search"><input id="s" placeholder="Search 50+ tools..." oninput="filt()"><button class="btn btn-primary" style="padding:10px 18px">Search</button></div></div><div class="grid" id="g"></div><div class="footer">© 2026 ToolzyAI V2 PRO - Made in Dehradun | Real AI Powered</div></div>
<div id="toolpage" class="page"><button class="btn" onclick="goHome()">← Back</button><div class="toolbox"><h2 id="tp-title">Tool</h2><p id="tp-desc" style="color:#888;margin:6px 0 14px;font-size:13px"></p><textarea id="tp-in" placeholder="Yaha likho... ex: Make viral bio for gym influencer"></textarea><button class="btn btn-primary" id="tp-btn" style="width:100%;padding:14px;margin-top:10px;font-size:15px" onclick="runReal()">Generate with Real AI ✨</button><div class="res" id="tp-out">Result yaha ayega... Real AI se!</div><div style="margin-top:12px;display:flex;gap:8px"><button class="btn" onclick="copyRes()">Copy</button><button class="btn" onclick="shareRes()">Share</button></div></div></div>
<div id="loginpage" class="page"><div class="loginbox"><h2>Welcome to ToolzyAI</h2><p style="color:#666;font-size:13px;margin-bottom:16px">Login karke tools save karo</p><input id="l-name" placeholder="Name"><input id="l-email" placeholder="Email"><button class="btn btn-primary" style="width:100%;padding:12px;margin-top:10px" onclick="doLogin()">Continue →</button><p style="margin-top:12px;color:#666;font-size:12px;cursor:pointer" onclick="goHome()">Skip</p></div></div>
<script>
const T=[["💬","AI Chat","Ask anything, real ChatGPT style"],["🖼️","Image Gen","Text to image with AI"],["✏️","Photo Editor","Edit with AI magic"],["📝","Bio Gen","Insta bio 1 click","HOT"],["#️⃣","Hashtag Gen","Viral hashtags","HOT"],["🔄","Paraphraser","Rewrite any text"],["📧","Email Writer","Pro emails"],["📱","Caption Gen","Insta captions viral"],["💡","Idea Gen","Viral content ideas"],["🎯","Name Gen","Brand names"],["📖","Story Gen","AI stories"],["🎤","Speech Writer","Powerful speeches"],["✍️","Essay Writer","Essays"],["📄","Resume Builder","ATS resume"],["🔍","SEO Title","Rank #1"],["💌","DM Gen","Flirty DMs"],["😂","Meme Ideas","Viral meme"],["🎬","Script Writer","YT scripts"],["📚","Summary Tool","Long to short"],["🌐","Translator","100+ languages"],["❤️","Love Letter","For crush"],["😎","Roast Gen","Savage roasts"],["🎮","Gaming Name","Pro gaming names"],["📈","Hook Gen","Stop scrolling"],["🧠","Quiz Maker","Instant quizzes"],["💼","LinkedIn Post","Viral LinkedIn"],["🐦","Tweet Gen","Viral tweets"],["🎵","Lyrics Writer","Songs"],["👶","Baby Name","Unique names"],["🧩","Slogan Maker","Catchy"],["🎁","Gift Ideas","Perfect gifts"],["🍔","Recipe Gen","From ingredients"],["✈️","Trip Planner","Itinerary"],["🏋️","Workout Plan","Fitness"],["💰","Business Ideas","Startups"],["📊","Excel Formula","Any formula"],["🧮","Math Solver","Solve math"],["💻","Code Explainer","Explain code"],["🎨","Color Palette","Brand colors"],["🔤","Acronym Maker","Acronyms"],["🤔","Would You Rather","Viral questions"],["📣","Ad Copy","High CTR ads"],["💬","Comment Reply","Smart replies"],["📦","Product Desc","E-com desc"],["🎙️","Podcast Title","Catchy titles"],["📘","Book Title","Bestseller"],["💭","Affirmations","Daily"],["🕵️","Riddle Gen","Mind teasers"],["📅","Content Calendar","30 days plan"],["🤖","Prompt Gen","Midjourney prompts"]];
let cur=0;const g=document.getElementById('g');
function rend(L){g.innerHTML=L.map(o=>{let i=T.indexOf(o);return `<div class=card onclick=openTool(${i})><div class=ico>${o[0]}</div>${o[3]?`<span class=badge>${o[3]}</span>`:''}<h3>${o[1]}</h3><p>${o[2].slice(0,26)}</p></div>`}).join('');}rend(T);
function filt(){let q=s.value.toLowerCase();rend(T.filter(x=>(x[1]+x[2]).toLowerCase().includes(q)));}
function goHome(){home.style.display='block';toolpage.classList.remove('on');loginpage.classList.remove('on');history.pushState({},'','/');}
function showLogin(){home.style.display='none';toolpage.classList.remove('on');loginpage.classList.add('on');}
function doLogin(){let n=document.getElementById('l-name').value||'User';let e=document.getElementById('l-email').value||'user@toolzyai.com';localStorage.setItem('toolzy_user',JSON.stringify({name:n,email:e}));checkAuth();goHome();}
function checkAuth(){let u=localStorage.getItem('toolzy_user');if(u){let j=JSON.parse(u);document.getElementById('auth').innerHTML=`<span style="font-size:13px;color:#aaa">Hi, ${j.name.split(' ')[0]} 👋</span> <button class=btn onclick="logout()">Logout</button>`;}}
function logout(){localStorage.removeItem('toolzy_user');location.reload();}checkAuth();
function openTool(i){cur=i;home.style.display='none';toolpage.classList.add('on');document.getElementById('tp-title').innerText=T[i][0]+' '+T[i][1];document.getElementById('tp-desc').innerText=T[i][2]+' - Real AI powered. Share link: toolzyai.vercel.app?tool='+i;document.getElementById('tp-in').value='';document.getElementById('tp-out').innerText='Result yaha ayega... Real AI se!';history.pushState({},'',`?tool=${i}`);window.scrollTo(0,0);}
async function runReal(){let inp=document.getElementById('tp-in').value||'Make it viral';let out=document.getElementById('tp-out');let btn=document.getElementById('tp-btn');out.innerText='🤖 Real AI soch raha hai...';btn.innerText='Generating...';btn.disabled=true;try{let prompt=`You are ${T[cur][1]}. User: ${inp}. Give short viral answer.`;let res=await fetch('https://text.pollinations.ai/'+encodeURIComponent(prompt));let txt=await res.text();out.innerText=txt.slice(0,1200);}catch(e){out.innerText=`✅ ${T[cur][1]} Result for "${inp}":\n→ Viral version: ${inp.toUpperCase()} 🔥\n→ #${T[cur][1].replace(' ','')} #Viral #ToolzyAI\n→ Post at 7PM IST for 10x reach.\n(Real AI busy tha, dobara try karo!)`;}btn.innerText='Generate with Real AI ✨';btn.disabled=false;}
function copyRes(){navigator.clipboard.writeText(document.getElementById('tp-out').innerText);alert('Copied!');}
function shareRes(){if(navigator.share){navigator.share({title:T[cur][1],text:document.getElementById('tp-out').innerText,url:location.href});}else{copyRes();}}
(function(){let p=new URLSearchParams(location.search);let t=p.get('tool');if(t!==null&&T[parseInt(t)]){setTimeout(()=>openTool(parseInt(t)),300);}})();
</script></body></html>
