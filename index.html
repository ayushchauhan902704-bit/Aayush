<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ius.chauhann</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
body{background:#000;color:#fff;max-width:480px;margin:0 auto}
.header{display:flex;justify-content:space-between;align-items:center;padding:12px 15px;border-bottom:1px solid #222}
.top-name{font-weight:600;display:flex;align-items:center;gap:5px}
.dp-row{display:flex;gap:20px;align-items:center}
.dp{width:90px;height:90px;border-radius:50%;padding:3px;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);cursor:pointer}
.dp img{width:100%;height:100%;border-radius:50%;border:3px solid #000;object-fit:cover}
.stats{display:flex;gap:25px;text-align:center}
.stat b{display:block;font-size:16px}
.bio-section{padding:15px}
.name{font-weight:600;margin-top:12px}
.bio{font-size:14px;margin-top:2px}
.btns{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;background:#363636;border:none;color:#fff;padding:8px;border-radius:8px;font-weight:600;cursor:pointer}
.highlights{display:flex;gap:15px;padding:15px;overflow-x:auto}
.hl{flex-shrink:0;text-align:center;cursor:pointer}
.hl-img{width:68px;height:68px;border-radius:50%;border:1px solid #333;padding:3px}
.hl-img img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.hl span{font-size:12px;margin-top:5px;display:block}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px}
.post{aspect-ratio:1;position:relative;overflow:hidden;background:#111;cursor:pointer}
.post img{width:100%;height:100%;object-fit:cover}
.views{position:absolute;bottom:5px;left:5px;font-size:12px;font-weight:600;text-shadow:0 0 5px #000}
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.95);z-index:999;justify-content:center;align-items:center;flex-direction:column}
.modal.active{display:flex}
.modal img{max-width:95%;max-height:85vh;border-radius:10px}
.close{position:absolute;top:15px;right:20px;font-size:30px;cursor:pointer}
</style>
</head>
<body>
<div class="bio-section">
<div class="dp-row">
<div class="dp" onclick="openDP()"><img src="https://i.pravatar.cc/300?img=33"></div>
