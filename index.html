<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ToolzyAI - 50+ Free Viral AI Tools</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#0a0a0f;color:#fff}
.header{position:sticky;top:0;z-index:50;background:rgba(10,10,15,0.9);backdrop-filter:blur(20px);border-bottom:1px solid #222;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:22px;background:linear-gradient(90deg,#f59e0b,#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.btn{padding:8px 16px;border-radius:999px;border:1px solid #333;background:#1a1a22;color:#fff;cursor:pointer;font-size:13px}
.btn-primary{background:linear-gradient(90deg,#f59e0b,#ef4444);border:0;font-weight:700}
.hero{text-align:center;padding:50px 20px 20px}
.hero h1{font-size:34px;font-weight:900;line-height:1.1;max-width:800px;margin:0 auto}
.hero h1 span{background:linear-gradient(90deg,#f59e0b,#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:#888;margin:14px auto;max-width:600px;font-size:14px}
.search{max-width:600px;margin:20px auto;background:#15151d;border:1px solid #2a2a35;border-radius:14px;display:flex;align-items:center;padding:4px 6px 4px 16px}
.search input{flex:1;background:transparent;border:0;color:#fff;outline:none;padding:10px 0;font-size:15px}
.grid{max-width:1200px;margin:20px auto;padding:0 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:#15151d;border:1px solid #252532;border-radius:16px;padding:16px;cursor:pointer}
.card:hover{border-color:#f59e0b;transform:translateY(-2px)}
.card.ico{width:36px;height:36px;border-radius:10px;background:#222;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:10px}
.card h3{font-size:13px;font-weight:700}
.card p{font-size:11px;color:#666;margin-top:4px}
.badge{display:inline-block;background:#f59e0b;color:#000;font-size:9px;font-weight:800;padding:2px 6px;border-radius:99px;margin-bottom:6px}
.footer{text-align:center;padding:30px;color:#444;font-size:12px;border-top:1px solid #1a1a1a;margin-top:40px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.box{background:#15151d;border:1px solid #333;border-radius:20px;max-width:500px;width:100%;padding:24px}
.box textarea{width:100%;background:#0a0a0f;border:1px solid #333;border-radius:10px;padding:12px;color:#fff;margin:12px 0;min-height:90px;outline:none}
.res{background:#0a0a0f;border:1px dashed #333;border-radius:10px;padding:14px;font-size:13px;color:#aaa;min-height:60px;margin-top:10px;white-space:pre-wrap}
</style>
</head>
<body>
<div class="header"><div class="logo">ToolzyAI</div><div><button class="btn">Login</button><button class="btn btn-primary">Get Started</button></div></div>
<div class="hero"><h1>Build with AI, <span>Create Everything</span> - 50+ Free Tools</h1><p>ToolBaz se bhi tez, simple aur viral tools. No login, no watermark, 100% free.</p><div class="search"><input id="s" placeholder="Search 50+ tools..." oninput="filt()"><button class="btn btn-primary" style="padding:10px 18px">Search</button></div></div>
<div class="grid" id="g"></div>
<div class="footer">© 2026 ToolzyAI - toolzyai.vercel.app - All tools free | Made in Dehradun</div>
<div class="modal" id="m" onclick="if(event.target.id==='m')this.classList.remove('on')"><div class="box"><div style="display:flex;justify-content:space-between"><h2 id="mt">Tool</h2><span onclick="document.getElementById('m').classList.remove('on')" style="cursor:pointer">✕</span></div><p id="md" style="color:#888;font-size:13px"></p><textarea id="mi" placeholder="Apna text yaha likho..."></textarea><button class="btn btn-primary" style="width:100%;padding:12px" onclick="run()">Generate ✨</button><div class="res" id="mr">Result yaha ayega...</div></div></div>
<script>
const T=[["💬","AI Chat","Ask anything"],["🖼️","Image Gen","Text to image"],["✏️","Photo Editor","Edit with AI"],["📝","Bio Gen","Insta bio 1 click","HOT"],["#️⃣","Hashtag Gen","Viral tags","HOT"],["🔄","Paraphraser","Rewrite"],["📧","Email Writer","Pro emails"],["📱","Caption Gen","Insta captions"],["💡","Idea Gen","Viral ideas"],["🎯","Name Gen","Brand names"],["📖","Story Gen","AI stories"],["🎤","Speech Writer","Powerful"],["✍️","Essay Writer","Essays"],["📄","Resume Builder","ATS resume"],["🔍","SEO Title","Rank #1"],["💌","DM Gen","Flirty DMs"],["😂","Meme Ideas","Viral"],["🎬","Script Writer","YT scripts"],["📚","Summary Tool","Long to short"],["🌐","Translator","100+ lang"],["❤️","Love Letter","For crush"],["😎","Roast Gen","Savage"],["🎮","Gaming Name","Pro names"],["📈","Hook Gen","Stop scrolling"],["🧠","Quiz Maker","Instant"],["💼","LinkedIn Post","Viral"],["🐦","Tweet Gen","Viral tweets"],["🎵","Lyrics Writer","Songs"],["👶","Baby Name","Unique"],["🧩","Slogan Maker","Catchy"],["🎁","Gift Ideas","Perfect gifts"],["🍔","Recipe Gen","Ingredients"],["✈️","Trip Planner","Itinerary"],["🏋️","Workout Plan","Fitness"],["💰","Business Ideas","Startups"],["📊","Excel Formula","Any formula"],["🧮","Math Solver","Solve"],["💻","Code Explainer","Explain code"],["🎨","Color Palette","Brand colors"],["🔤","Acronym Maker","Acronyms"],["🤔","Would You Rather","Viral Qs"],["📣","Ad Copy","High CTR"],["💬","Comment Reply","Smart replies"],["📦","Product Desc","E-com desc"],["🎙️","Podcast Title","Catchy"],["📘","Book Title","Bestseller"],["💭","Affirmations","Daily"],["🕵️","Riddle Gen","Mind teasers"],["📅","Content Calendar","30 days"],["🤖","Prompt Gen","Midjourney"]];
let a=0;const g=document.getElementById('g');
function rend(L){g.innerHTML=L.map(t=>{let i=T.indexOf(t);return `<div class="card" onclick="openT(${i})"><div class="ico">${t[0]}</div>${t[3]?`<span class="badge">${t[3]}</span>`:''}<h3>${t[1]}</h3><p>${t[2]}</p></div>`}).join('');}
rend(T);
function filt(){let q=document.getElementById('s').value.toLowerCase();rend(T.filter(x=>(x[1]+x[2]).toLowerCase().includes(q)));}
function openT(i){a=i;document.getElementById('mt').innerText=T[i][1];document.getElementById('md').innerText=T[i][2];document.getElementById('mi').value='';document.getElementById('mr').innerText='Result yaha ayega...';document.getElementById('m').classList.add('on');}
function run(){let inp=document.getElementById('mi').value||'Demo';let name=T[a][1];let o=document.getElementById('mr');o.innerText='Generating...';setTimeout(()=>{let R={"Bio Gen":"🔥 "+inp+" | Digital Creator 🚀\n💡 Helping you grow\n✨ "+inp+" Lover","Hashtag Gen":"#"+inp.replace(/\\s/g,'')+" #viral #trending #reels #explore #foryou #instagood #fyp"};o.innerText=R[name]||"✅ "+name+" Result for "+inp+":\n→ "+inp+" is viral-ready for Insta, YT & TikTok.\n→ Post at 7PM IST for 10x reach.\nMade with ❤️ ToolzyAI";},700);}
</script>
</body>
</html>
